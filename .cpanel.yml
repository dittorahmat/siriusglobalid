# cPanel Git Version Control: file ini dibaca otomatis saat klik
# "Deploy" di cPanel. HANYA theme + importer yang di-deploy ke instalasi
# WordPress. Core, plugin, uploads, wp-config.php, dan DB MySQL TIDAK
# PERNAH disentuh deploy; ikut backup Softaculous/cPanel.
---
deployment:
  tasks:
    - export WPTHEME=$HOME/public_html/wp-content/themes/sirius-custom/
    - export WPTOOL=$HOME/public_html/wp-content/sgi-importer/
    - mkdir -p $WPTHEME $WPTOOL
    - /bin/cp -R wp-content/themes/sirius-custom/. $WPTHEME
    - /bin/cp tools/sgi-importer.php tools/verify-seed.py $WPTOOL
    - /bin/cp gh-deploy.php $HOME/public_html/gh-deploy.php
