# Lint-only CI. Tidak menyentuh hosting sama sekali (tidak ada FTP/SSH/deploy).
# Workflow deploy FTP dulu (.github/workflows/deploy.yml) dihapus karena firewall
# hosting memblokir IP GitHub runner (ETIMEDOUT port 21). Job ini hanya cek
# sintaks PHP theme + importer; deploy tetap via cPanel Git Version Control
# sesuai AGENTS.md.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check (theme + importer)
        run: |
          failed=0
          for f in $(find wp-content/themes/sirius-custom tools/sgi-importer.php gh-deploy.php -name '*.php' 2>/dev/null); do
            php -l "$f" || failed=1
          done
          exit $failed
