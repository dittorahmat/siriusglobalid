# Lint-only CI: sintaks PHP, smoke test theme, aturan mekanis AGENTS, seed,
# dan validasi OpenSpec. Tidak menyentuh hosting; deploy via cPanel.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check (theme + tools + deploy)
        run: |
          failed=0
          for f in $(find wp-content/themes/sirius-custom tools gh-deploy.php -name '*.php' 2>/dev/null); do
            php -l "$f" || failed=1
          done
          exit $failed
  php-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uji perilaku theme tanpa WordPress (stub)
        run: php tools/sgi-smoke.php
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aturan mekanis AGENTS
        run: php tools/sgi-static-check.php
      - name: Kontrak seed importer
        run: python tools/verify-seed.py
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validasi OpenSpec
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict
