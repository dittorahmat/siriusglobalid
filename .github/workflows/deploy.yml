name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # tombol "Run workflow" manual dari tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy ke shared hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }} # hostname saja, mis. ftp.siriusglobal.id
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # FTPS eksplisit. Ganti ke ftp jika server menolak.
          port: 21
          local-dir: ./
          # Ganti ke / jika web root FTP sudah langsung public_html,
          # atau ke subfolder bila deploy ke addon-domain.
          server-dir: /public_html/
          # dangerous-clean-slate default false: file lama di server TIDAK dihapus.
          log-level: minimal
          exclude:
            - **/.git*/**
            - **/.github/**
            - .agents/**
            - .claude/**
            - .commandcode/**
            - .hermes/**
            - .openhands/**
            - .pi/**
            - .qwen/**
            - .zcode/**
            - skills/**
            - **/*.md
            - skills-lock.json
